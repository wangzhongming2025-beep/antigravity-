<!DOCTYPE html>
<html lang="zh-CN" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabor 视觉感知训练 · 多模式 - VisionGuard AI</title>
    <meta name="description" content="基于视觉科学的 Gabor 斑块感知训练工具，提供方向辨别、对比敏感度、空间频率、视觉搜索（找不同）、运动方向（漂移 Gabor）五种练习模式，作为日常视觉放松与感知练习。">
    <meta name="keywords" content="Gabor Patch, 视觉感知训练, 对比敏感度, 空间频率, 视觉搜索, 找不同, 运动方向, 漂移Gabor, 视觉放松, 护眼练习">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #e4e4e7;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .glass-card {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .scanner-line {
            position: absolute;
            height: 2px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #22d3ee, transparent);
            animation: scan 3s linear infinite;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0% }
            100% { top: 100% }
        }

        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        .success-flash {
            animation: success 0.5s ease-out;
        }

        @keyframes success {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
            50% { box-shadow: 0 0 40px 10px rgba(16, 185, 129, 0.4); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        canvas {
            image-rendering: pixelated;
        }

        .mode-tab {
            flex: 1;
            padding: 10px 4px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            color: #a1a1aa;
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }

        .mode-tab.active {
            background: rgba(34, 211, 238, 0.15);
            border-color: #22d3ee;
            color: #22d3ee;
        }

        .disclaimer {
            font-size: 10px;
            color: #52525b;
            text-align: center;
            margin-top: 18px;
            line-height: 1.5;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Back -->

    <!-- Mode Tabs -->

        <button onclick="setMode('search')" id="tab-search" class="mode-tab">视觉搜索</button>

    </div>

    <!-- Training Arena -->
    <main class="relative w-full max-w-md flex flex-col items-center">

        <!-- Canvas Container -->
        <div class="relative w-72 h-72 md:w-80 md:h-80 glass-card rounded-full p-2 mb-10 flex items-center justify-center shadow-[0_0_50px_rgba(34,211,238,0.1)] overflow-hidden"

            <!-- Frequency pair (hidden by default) -->
            <div id="freq-pair" class="hidden relative z-20 items-center justify-center gap-3">
                <canvas id="gabor-canvas-a" width="256" height="256" class="w-28 h-28 rounded-2xl bg-zinc-800"></canvas>
                <canvas id="gabor-canvas-b" width="256" height="256" class="w-28 h-28 rounded-2xl bg-zinc-800"></canvas>

        <!-- Guidance Overlay -->

    </div>

        <!-- Visual Search Grid (hidden by default) -->

        <!-- Search Result Overlay -->

        <!-- Instructions -->
        <div class="text-center mb-8 px-6">
            <p id="instruction-text" class="text-sm text-zinc-400 leading-relaxed italic">
                “观察斑点纹理的方向，选择正确的倾斜角度”
            </p>
            <p class="text-[10px] text-zinc-600 mt-2">
                由视觉科学模型驱动 · 日常感知练习
            </p>
        </div>

        <!-- Choice: Orientation (4 angles) -->
        <div id="opts-orientation" class="grid grid-cols-2 gap-4 w-full px-4">
            <button onclick="checkAnswer(45)"
                class="option-btn glass-card py-6 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-800 border-zinc-700/50">
                <div class="w-12 h-1 bg-zinc-300 rotate-45 rounded-full shadow-lg shadow-white/10"></div>
                <span class="text-xs font-bold text-zinc-500">45° 斜向 (/)</span>
            </button>
            <button onclick="checkAnswer(135)"
                class="option-btn glass-card py-6 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-800 border-zinc-700/50">
                <div class="w-12 h-1 bg-zinc-300 -rotate-45 rounded-full shadow-lg shadow-white/10"></div>
                <span class="text-xs font-bold text-zinc-500">135° 斜向 (\)</span>
            </button>
            <button onclick="checkAnswer(90)"
                class="option-btn glass-card py-6 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-800 border-zinc-700/50">
                <div class="w-12 h-1 bg-zinc-300 rotate-90 rounded-full shadow-lg shadow-white/10"></div>
                <span class="text-xs font-bold text-zinc-500">90° 垂直 (|)</span>
            </button>
            <button onclick="checkAnswer(0)"
                class="option-btn glass-card py-6 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-800 border-zinc-700/50">
                <div class="w-12 h-1 bg-zinc-300 rounded-full shadow-lg shadow-white/10"></div>
                <span class="text-xs font-bold text-zinc-500">0° 水平 (—)</span>
            </button>
        </div>

        <!-- Choice: Contrast (seen / not seen) -->
        <div id="opts-contrast" class="hidden grid grid-cols-2 gap-4 w-full px-4">
            <button onclick="answerContrast(true)"
                class="option-btn glass-card py-6 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-800 border-zinc-700/50">
                <span class="text-2xl">👁️</span>
                <span class="text-xs font-bold text-zinc-500">看得见</span>
            </button>
            <button onclick="answerContrast(false)"
                class="option-btn glass-card py-6 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-800 border-zinc-700/50">
                <span class="text-2xl">🌫️</span>
                <span class="text-xs font-bold text-zinc-500">看不见</span>
            </button>
        </div>

        <!-- Choice: Frequency (which side denser) -->
        <div id="opts-frequency" class="hidden grid grid-cols-2 gap-4 w-full px-4">
            <button onclick="answerFreq('a')"
                class="option-btn glass-card py-6 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-800 border-zinc-700/50">
                <span class="text-xs font-bold text-zinc-500">← 左侧更密</span>
            </button>
            <button onclick="answerFreq('b')"
                class="option-btn glass-card py-6 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-800 border-zinc-700/50">
                <span class="text-xs font-bold text-zinc-500">右侧更密 →</span>
            </button>
        </div>

        <!-- Choice: Motion direction (which way is it drifting) -->
        <div id="opts-motion" class="hidden grid grid-cols-4 gap-3 w-full px-4">
            <button onclick="pickMotion('up')"
                class="option-btn glass-card py-5 rounded-2xl flex flex-col items-center gap-1 hover:bg-zinc-800 border-zinc-700/50">
                <span class="text-2xl">↑</span><span class="text-[10px] font-bold text-zinc-500">上</span>
            </button>
            <button onclick="pickMotion('left')"
                class="option-btn glass-card py-5 rounded-2xl flex flex-col items-center gap-1 hover:bg-zinc-800 border-zinc-700/50">
                <span class="text-2xl">←</span><span class="text-[10px] font-bold text-zinc-500">左</span>
            </button>
            <button onclick="pickMotion('right')"
                class="option-btn glass-card py-5 rounded-2xl flex flex-col items-center gap-1 hover:bg-zinc-800 border-zinc-700/50">
                <span class="text-2xl">→</span><span class="text-[10px] font-bold text-zinc-500">右</span>
            </button>
            <button onclick="pickMotion('down')"
                class="option-btn glass-card py-5 rounded-2xl flex flex-col items-center gap-1 hover:bg-zinc-800 border-zinc-700/50">
                <span class="text-2xl">↓</span><span class="text-[10px] font-bold text-zinc-500">下</span>
            </button>
        </div>

        <footer class="mt-10 w-full px-6 text-center">
            <div class="flex justify-between text-[10px] text-zinc-500 mb-2 font-mono">
                <span id="metric-label">激活深度</span>
                <span id="metric-val">100%</span>
            </div>
            <div class="w-full h-1.5 bg-zinc-900 rounded-full overflow-hidden mb-8">
                <div id="progress-indicator"
                    class="h-full bg-gradient-to-r from-cyan-600 to-cyan-400 transition-all duration-500"
                    style="width: 5%"></div>
            </div>

            <button onclick="submitGaborSession()"
                class="text-xs text-zinc-600 border border-zinc-800 px-4 py-2 rounded-lg hover:text-white transition-colors">
                结束特训并上报
            </button>
        </footer>

        <p class="disclaimer">
            本工具为视觉感知休闲练习，非医疗诊断或治疗，如有视力问题请就医。
        </p>

    </main>

    <script src="auth_trainee.js"></script>
    <script>
        const canvas = document.getElementById('gabor-canvas');
        const ctx = canvas.getContext('2d');
        const canvasA = document.getElementById('gabor-canvas-a');
        const ctxA = canvasA.getContext('2d');
        const canvasB = document.getElementById('gabor-canvas-b');
        const ctxB = canvasB.getContext('2d');
        const SIZE = 256;

        let mode = 'orientation';
        let isProcessing = false;

        let gs = {
            level: 1,
            contrast: 0.8,
            freq: 0.08,
            targetAngle: 0,
            sigma: 40,
            score: 0,
            // contrast mode
            cThreshold: 1.0,
            cSignal: true,
            bestC: 1.0,
            // frequency mode
            fBase: 0.12,
            fDiff: 0.06,
            fDenser: 'a',
            // search mode (visual odd-one-out)
            searchGrid: 3,
            searchRatio: 1.7,
            searchTarget: -1,
            // motion mode (drifting gabor)
            motionSpeed: 0.9,
            motionMx: -1,
            motionMy: 0,
            motionDir: 'right'
        };

        let motionRAF = null;

        function drawGaborTo(c, angle, contrast, frequency, sigma, radius) {
            const S = c.width;
            const imageData = c.createImageData(S, S);
            const data = imageData.data;
            const mid = S / 2;
            const radians = (angle + 90) * (Math.PI / 180);
            const cosA = Math.cos(radians);
            const sinA = Math.sin(radians);
            const r2 = (radius && radius > 0) ? radius * radius : S * S;
            for (let y = 0; y < S; y++) {
                for (let x = 0; x < S; x++) {
                    const dx = x - mid;
                    const dy = y - mid;
                    const x_rot = dx * cosA + dy * sinA;
                    const distSq = dx * dx + dy * dy;
                    let val = 127.5;
                    if (distSq <= r2) {
                        const envelope = Math.exp(-distSq / (2 * sigma * sigma));
                        const grating = Math.cos(2 * Math.PI * frequency * x_rot);
                        val = 127.5 + (127.5 * contrast * envelope * grating);
                    }
                    const idx = (y * S + x) * 4;
                    data[idx] = data[idx + 1] = data[idx + 2] = val;
                    data[idx + 3] = 255;
                }
            }
            c.putImageData(imageData, 0, 0);
        }

        function drawGaborMotion(c, mx, my, contrast, frequency, sigma, t) {
            const S = c.width;
            const imageData = c.createImageData(S, S);
            const data = imageData.data;
            const mid = S / 2;
            const w = 2 * Math.PI * frequency;
            const omega = 2 * Math.PI * gs.motionSpeed;
            for (let y = 0; y < S; y++) {
                for (let x = 0; x < S; x++) {
                    const dx = x - mid;
                    const dy = y - mid;
                    const proj = dx * mx + dy * my;
                    const distSq = dx * dx + dy * dy;
                    const envelope = Math.exp(-distSq / (2 * sigma * sigma));
                    const grating = Math.cos(w * proj + omega * t);
                    const val = 127.5 + (127.5 * contrast * envelope * grating);
                    const idx = (y * S + x) * 4;
                    data[idx] = data[idx + 1] = data[idx + 2] = val;
                    data[idx + 3] = 255;
                }
            }
            c.putImageData(imageData, 0, 0);
        }

        function startMotionLoop() {
            const start = performance.now();
            function frame(now) {
                const t = (now - start) / 1000;
                drawGaborMotion(ctx, gs.motionMx, gs.motionMy, 0.85, 0.08, 55, t);
                motionRAF = requestAnimationFrame(frame);
            }
            motionRAF = requestAnimationFrame(frame);
        }

        function flash(kind, msg) {
            const hint = document.getElementById('status-hint');
            const text = document.getElementById('status-text');
            text.innerText = msg;
            text.className = "text-2xl font-bold uppercase italic tracking-tighter " +
                (kind === 'success' ? "text-emerald-400" : "text-red-400");
            const container = document.getElementById('canvas-container');
            container.classList.add('success-flash');
            setTimeout(() => container.classList.remove('success-flash'), 500);
            hint.classList.remove('opacity-0');
            setTimeout(() => hint.classList.add('opacity-0'), 600);
        }

        function updateMetric() {
            const lvl = document.getElementById('level-display');
            const lab = document.getElementById('metric-label');
            const val = document.getElementById('metric-val');
            const prog = document.getElementById('progress-indicator');
            if (mode === 'orientation') {
                lvl.innerText = gs.level;
                lab.innerText = '激活深度';
                let d = gs.level * 5; if (d > 100) d = 100;
                val.innerText = d + '%';
                prog.style.width = d + '%';
            } else if (mode === 'contrast') {
                lvl.innerText = gs.level;
                lab.innerText = '灵敏度';
                let s = Math.round((1 - gs.bestC) * 100); if (s < 0) s = 0; if (s > 100) s = 100;
                val.innerText = s + '%';
                prog.style.width = s + '%';
            } else if (mode === 'frequency') {
                lvl.innerText = gs.level;
                lab.innerText = '辨别力';
                let f = Math.round((1 - gs.fDiff / 0.06) * 100); if (f < 0) f = 0; if (f > 100) f = 100;
                val.innerText = f + '%';
                prog.style.width = f + '%';
            } else if (mode === 'motion') {
                lvl.innerText = gs.level;
                lab.innerText = '运动感知';
                let r = Math.round((1 - (gs.motionSpeed - 0.2) / (0.9 - 0.2)) * 100); if (r < 0) r = 0; if (r > 100) r = 100;
                val.innerText = r + '%';
                prog.style.width = r + '%';
            } else {
                lvl.innerText = gs.level;
                lab.innerText = '尺寸辨别';
                let r = Math.round((1 - (gs.searchRatio - 1) / (2.0 - 1)) * 100); if (r < 0) r = 0; if (r > 100) r = 100;
                val.innerText = r + '%';
                prog.style.width = r + '%';
            }
        }

        function nextTrial() {
            isProcessing = false;
            if (mode === 'orientation') {
                const angles = [0, 45, 90, 135];
                gs.targetAngle = angles[Math.floor(Math.random() * 4)];
                gs.contrast = Math.max(0.05, 0.8 * Math.pow(0.85, gs.level - 1));
                gs.freq = 0.06 + gs.level * 0.002;
                drawGaborTo(ctx, gs.targetAngle, gs.contrast, gs.freq, gs.sigma);
            } else if (mode === 'contrast') {
                gs.cSignal = Math.random() < 0.5;
                gs.cThreshold = Math.max(0.03, Math.min(1.0, gs.cThreshold));
                drawGaborTo(ctx, 45, gs.cSignal ? gs.cThreshold : 0, 0.08, gs.sigma);
            } else if (mode === 'frequency') {
                gs.fDenser = Math.random() < 0.5 ? 'a' : 'b';
                const fa = gs.fDenser === 'a' ? gs.fBase + gs.fDiff : gs.fBase;
                const fb = gs.fDenser === 'a' ? gs.fBase : gs.fBase + gs.fDiff;
                drawGaborTo(ctxA, 45, 0.8, fa, gs.sigma);
                drawGaborTo(ctxB, 45, 0.8, fb, gs.sigma);
            } else if (mode === 'search') {
                renderSearchGrid();
            } else if (mode === 'motion') {
                const dirs = [[1, 0, 'right'], [-1, 0, 'left'], [0, -1, 'up'], [0, 1, 'down']];
                const d = dirs[Math.floor(Math.random() * dirs.length)];
                gs.motionMx = -d[0];
                gs.motionMy = -d[1];
                gs.motionDir = d[2];
                if (motionRAF) cancelAnimationFrame(motionRAF);
                startMotionLoop();
            }
            updateMetric();
        }

        function setMode(m) {
            mode = m;
            if (motionRAF) { cancelAnimationFrame(motionRAF); motionRAF = null; }
            const sl = document.querySelector('.scanner-line');
            if (sl) sl.style.display = (m === 'motion') ? 'none' : 'block';
            ['orientation', 'contrast', 'frequency', 'search', 'motion'].forEach(x => {
                document.getElementById('tab-' + x).classList.toggle('active', x === m);
            });
            document.getElementById('opts-orientation').classList.toggle('hidden', m !== 'orientation');
            document.getElementById('opts-contrast').classList.toggle('hidden', m !== 'contrast');
            document.getElementById('opts-frequency').classList.toggle('hidden', m !== 'frequency');
            document.getElementById('opts-motion').classList.toggle('hidden', m !== 'motion');
            document.getElementById('freq-pair').classList.toggle('hidden', m !== 'frequency');
            document.getElementById('canvas-container').style.display = (m === 'search') ? 'none' : 'flex';
            document.getElementById('search-grid').style.display = (m === 'search') ? 'grid' : 'none';
            document.getElementById('search-status').classList.add('hidden');

            const instr = {
                orientation: '“观察斑点纹理的方向，选择正确的倾斜角度”',
                contrast: '“灰雾里能看到条纹吗？能看到就点「看得见」，全是灰就点「看不见」”',
                frequency: '“对比左右两块，哪一侧条纹更密（更细）？”',
                search: '“一堆圆斑里，找那个明显更大或更小的圆，点它”',
                motion: '“盯住斑块，判断条纹在朝哪个方向漂：上 / 下 / 左 / 右”'
            };
            document.getElementById('instruction-text').innerText = instr[m];

            // reset state
            gs.level = 1; gs.score = 0; gs.contrast = 0.8; gs.freq = 0.08;
            gs.cThreshold = 0.95; gs.bestC = 1.0; gs.fDiff = 0.06; gs.fBase = 0.12;
            gs.searchGrid = 3; gs.searchRatio = 1.7; gs.searchTarget = -1;
            gs.motionSpeed = 0.9;
            nextTrial();
        }

        function checkAnswer(selectedAngle) {
            if (mode !== 'orientation' || isProcessing) return;
            isProcessing = true;
            if (selectedAngle === gs.targetAngle) {
                gs.score++;
                if (gs.score >= 2) { gs.level++; gs.score = 0; }
                flash('success', '匹配成功');
            } else {
                if (gs.level > 1) gs.level--;
                gs.score = 0;
                flash('fail', '干扰偏差');
            }
            setTimeout(nextTrial, 800);
        }

        function answerContrast(seen) {
            if (mode !== 'contrast' || isProcessing) return;
            isProcessing = true;
            const correct = (seen === gs.cSignal);
            if (correct) {
                gs.cThreshold *= 0.9;
                if (gs.cThreshold < gs.bestC) gs.bestC = gs.cThreshold;
                flash('success', '判断准确');
            } else {
                gs.cThreshold = Math.min(1.0, gs.cThreshold * 1.12);
                flash('fail', '再看看');
            }
            gs.level++;
            setTimeout(nextTrial, 650);
        }

        function answerFreq(side) {
            if (mode !== 'frequency' || isProcessing) return;
            isProcessing = true;
            const correct = (side === gs.fDenser);
            if (correct) {
                gs.fDiff = Math.max(0.004, gs.fDiff * 0.85);
                gs.level++;
                flash('success', '判断准确');
            } else {
                gs.fDiff = Math.min(0.08, gs.fDiff * 1.18);
                flash('fail', '再看看');
            }
            setTimeout(nextTrial, 650);
        }

        function renderSearchGrid() {
            const grid = document.getElementById('search-grid');
            grid.innerHTML = '';
            const n = gs.searchGrid;
            grid.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
            const total = n * n;
            const targetIdx = Math.floor(Math.random() * total);
            const baseR = 26;
            const bigger = Math.random() < 0.5;
            const targetR = bigger ? baseR * gs.searchRatio : baseR / gs.searchRatio;
            const angle = 45, freq = 0.10, sig = 11, contrast = 0.85;
            for (let i = 0; i < total; i++) {
                const r = (i === targetIdx) ? targetR : baseR;
                const cv = document.createElement('canvas');
                cv.width = 72; cv.height = 72;
                cv.className = 'rounded-xl bg-zinc-800 cursor-pointer transition-transform hover:scale-105';
                cv.style.width = '100%';
                cv.style.aspectRatio = '1 / 1';
                cv.onclick = ((idx) => () => pickSearch(idx))(i);
                drawGaborTo(cv.getContext('2d'), angle, contrast, freq, sig, r);
                grid.appendChild(cv);
            }
            gs.searchTarget = targetIdx;
        }

        function pickSearch(i) {
            if (mode !== 'search' || isProcessing) return;
            isProcessing = true;
            if (i === gs.searchTarget) {
                gs.score++;
                if (gs.score >= 2 && gs.searchGrid < 7) { gs.searchGrid++; gs.score = 0; }
                gs.searchRatio = Math.max(1.05, gs.searchRatio * 0.92);
                gs.level++;
                showSearchResult('success', '找到了');
            } else {
                gs.level = Math.max(1, gs.level - 1);
                gs.searchRatio = Math.min(2.0, gs.searchRatio * 1.12);
                gs.score = 0;
                showSearchResult('fail', '再找找');
            }
            updateMetric();
            setTimeout(renderSearchGrid, 750);
        }

        function showSearchResult(kind, msg) {
            const el = document.getElementById('search-status');
            el.innerText = msg;
            el.className = 'absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-40 text-2xl font-bold uppercase italic tracking-tighter pointer-events-none ' +
                (kind === 'success' ? 'text-emerald-400' : 'text-red-400');
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 700);
        }

        function pickMotion(dir) {
            if (mode !== 'motion' || isProcessing) return;
            isProcessing = true;
            if (dir === gs.motionDir) {
                gs.score++;
                gs.motionSpeed = Math.max(0.15, gs.motionSpeed * 0.9);
                gs.level++;
                flash('success', '看准了');
            } else {
                gs.level = Math.max(1, gs.level - 1);
                gs.motionSpeed = Math.min(1.2, gs.motionSpeed * 1.12);
                gs.score = 0;
                flash('fail', '再看看');
            }
            if (motionRAF) { cancelAnimationFrame(motionRAF); motionRAF = null; }
            setTimeout(nextTrial, 800);
        }

        window.onload = () => {
            try {
                if (typeof TraineeAuth !== 'undefined' && !TraineeAuth.checkAuth()) return;
            } catch (e) { /* auth unavailable -> allow local preview */ }
            setMode('orientation');
        };

        function submitGaborSession() {
            if (confirm('确定结束本次特训并上报成绩吗？')) {
                const project = 'gabor_' + mode;
                const score = mode === 'contrast' ? Math.round((1 - gs.bestC) * 100) : gs.level;
                if (typeof TraineeAuth !== 'undefined') TraineeAuth.reportResult(project, score, 0);
                alert('成绩已上报！模式：' + mode + '，成绩：' + score);
                setTimeout(() => location.href = 'index.html', 1000);
            }
        }
    </script>
</body>
