<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>任务拆解器 · ADHD工具箱</title>
<style>
/* ── CSS variables ── */
:root {
  --bg: #f5f0eb;
  --bg-gradient: linear-gradient(165deg, #f5f0eb 0%, #ebe4dc 50%, #f0e8e0 100%);
  --card: rgba(255,255,255,0.85);
  --card-border: rgba(255,255,255,0.5);
  --primary: #7c9a92;
  --primary-dark: #5d7d75;
  --primary-light: #e8f0ee;
  --primary-glow: rgba(124,154,146,0.15);
  --accent: #d4a574;
  --accent-dark: #c08e5a;
  --accent-light: #f5ede4;
  --accent-glow: rgba(212,165,116,0.15);
  --purple: #a88dc8;
  --purple-light: #ede8f5;
  --green: #8db580;
  --green-light: #e8f5e8;
  --danger: #d18e8e;
  --danger-light: #f8eeee;
  --text: #3d3d3d;
  --text-secondary: #8a8a8a;
  --text-muted: #b8b0a8;
  --border: rgba(0,0,0,0.06);
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
  --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
  --transition: 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition-linear: 0.2s ease;
}
[data-theme="decompose"] { --theme: var(--primary); --theme-light: var(--primary-light); --theme-glow: var(--primary-glow); }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg-gradient);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 0;
}

.container {
  max-width: 520px;
  margin: 0 auto;
  padding: 28px 16px 80px;
}

.page-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
  padding-top: 8px;
}
.page-header h1 { font-size: 1.35rem; font-weight: 700; }

.back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px; height: 38px;
  border: none;
  background: var(--card);
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.1rem;
  color: var(--text);
  box-shadow: var(--shadow-sm);
  transition: transform var(--transition), box-shadow var(--transition);
  text-decoration: none;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--card-border);
}
.back-btn:hover { transform: scale(1.1) translateX(-2px); box-shadow: var(--shadow); }
.back-btn:active { transform: scale(0.92); }

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
  margin-bottom: 14px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  transition: box-shadow var(--transition-linear);
}
.card-soft {
  background: linear-gradient(135deg, var(--theme-light) 0%, var(--card) 60%);
  border: 1px solid var(--card-border);
}

input {
  font-family: inherit;
  font-size: 1rem;
  color: var(--text);
  background: var(--bg);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  width: 100%;
  transition: border-color var(--transition-linear), box-shadow var(--transition-linear);
  outline: none;
}
input:focus {
  border-color: var(--theme, var(--primary));
  box-shadow: 0 0 0 4px var(--theme-glow, var(--primary-glow));
  background: white;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  padding: 14px 24px;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition-linear);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

.btn-primary {
  background: linear-gradient(135deg, var(--theme, var(--primary)) 0%, var(--theme, var(--primary-dark)) 100%);
  color: white;
  box-shadow: 0 4px 14px var(--theme-glow, var(--primary-glow));
}
.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--theme-glow, var(--primary-glow));
}
.btn-accent {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  color: white;
  box-shadow: 0 4px 14px var(--accent-glow);
}
.btn-accent:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
.btn-outline {
  background: transparent;
  color: var(--text-secondary);
  border: 2px solid var(--border);
  box-shadow: none;
}
.btn-outline:hover:not(:disabled) {
  border-color: var(--text-muted);
  color: var(--text);
  background: rgba(0,0,0,0.02);
  transform: translateY(-1px);
}
.btn-sm { padding: 10px 16px; font-size: 0.85rem; }
.btn-block { width: 100%; }

.section-title {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.section-subtitle {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 16px;
  line-height: 1.5;
}
.text-center { text-align: center; }
.text-secondary { color: var(--text-secondary); font-size: 0.9rem; }
.mt-sm { margin-top: 8px; }
.mt-md { margin-top: 16px; }
.mt-lg { margin-top: 24px; }
.mb-sm { margin-bottom: 8px; }
.flex { display: flex; }
.gap-sm { gap: 8px; }

/* ── Step list ── */
.step-list { list-style: none; }
.step-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  transition: opacity var(--transition-linear);
}
.step-item:last-child { border-bottom: none; }
.step-number {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--primary-light);
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 1px;
  transition: all var(--transition);
}
.step-item.done .step-number {
  background: var(--green-light);
  color: var(--green);
}
.step-content {
  flex: 1;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.step-emoji {
  font-size: 1rem;
  flex-shrink: 0;
  width: 24px;
  text-align: center;
}
.step-text {
  flex: 1;
  font-size: 0.92rem;
  line-height: 1.5;
  transition: color var(--transition-linear);
}
.step-item.done .step-text {
  text-decoration: line-through;
  color: var(--text-muted);
}
.step-checkbox {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid var(--border);
  cursor: pointer;
  flex-shrink: 0;
  transition: all var(--transition);
  -webkit-appearance: none;
  appearance: none;
  position: relative;
}
.step-checkbox:checked {
  background: var(--green);
  border-color: var(--green);
  animation: pop 0.3s ease;
}
.step-checkbox:checked::after {
  content: '✓';
  color: white;
  font-size: 0.75rem;
  font-weight: 700;
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Category tag ── */
.category-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  border-radius: 99px;
  font-size: 0.75rem;
  font-weight: 600;
  background: var(--theme-light, var(--primary-light));
  color: var(--primary-dark);
  margin-bottom: 8px;
}
.steps-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 99px;
  font-size: 0.7rem;
  font-weight: 600;
  background: var(--theme-glow, var(--primary-glow));
  color: var(--primary-dark);
}

/* ── Task examples ── */
.task-examples {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.task-example-chip {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 0.75rem;
  background: var(--bg);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-linear);
  border: 1px solid transparent;
  user-select: none;
}
.task-example-chip:hover {
  border-color: var(--theme, var(--primary));
  color: var(--text);
  background: white;
}

/* ── Focus mode ── */
#firstStepFocus .big-step-wrap {
  background: white;
  border-radius: var(--radius-sm);
  padding: 16px;
  margin: 12px 0;
  text-align: left;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
#firstStepFocus .big-step-wrap .step-emoji {
  font-size: 1.3rem;
  margin-top: 1px;
}
#firstStepFocus .big-step-wrap .big-step-text {
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.5;
  color: var(--text);
}

/* ── Back to top ── */
.back-to-top-btn {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1.2rem;
  color: var(--text-secondary);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-linear), transform var(--transition);
  z-index: 50;
}
.back-to-top-btn.visible {
  opacity: 1;
  pointer-events: auto;
}
.back-to-top-btn:hover {
  transform: translateY(-3px);
  color: var(--text);
}

/* ── Celebration overlay ── */
.celebration-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
  overflow: hidden;
}
.confetti-piece {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 2px;
  animation: confettiFall var(--duration, 3s) ease-out forwards;
  opacity: 0;
}
@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg) scale(0.3); opacity: 0; }
}

/* ── History ── */
.dump-entry {
  padding: 16px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  font-size: 0.88rem;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  border-left: 3px solid var(--primary);
}
.dump-entry-meta {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── Animations ── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes bounceIn {
  0% { transform: scale(0); opacity: 0; }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in-up { animation: fadeInUp 0.5s ease both; }
.bounce-in { animation: bounceIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.slide-up { animation: slideUp 0.3s ease both; }

@media (max-width: 480px) {
  .container { padding: 20px 14px 60px; }
  .card { padding: 20px; }
  .page-header h1 { font-size: 1.2rem; }
  .task-examples { gap: 4px; }
  .task-example-chip { font-size: 0.7rem; padding: 3px 8px; }
}
</style>
</head>
<body data-theme="decompose">

<div class="container">
  <div class="page-header">
    <a href="#" onclick="event.preventDefault();history.back()" class="back-btn">←</a>
    <h1>🧩 任务拆解器</h1>
  </div>

  <div class="card card-soft">
    <p class="section-subtitle">
      ADHD的大脑面对大任务会直接宕机。<br>把任务拆成微步骤，大脑就不会逃跑了。
    </p>
    <label class="section-title" for="taskInput">你要做什么？</label>
    <input type="text" id="taskInput" placeholder="比如：写周报、整理房间、准备面试……" autofocus>
    <button class="btn btn-primary btn-block mt-sm" id="decomposeBtn">🔨 拆解它</button>
    <div class="task-examples" id="taskExamples">

  <div id="resultArea" style="display:none">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div>
          <span id="categoryTag" class="category-tag" style="display:none"></span>
          <span class="section-title" style="margin-bottom:0">拆解步骤</span>
        </div>
        <span id="stepCount" class="steps-badge"></span>
      </div>

      <div id="stepProgress" style="margin-bottom:16px;display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:0.8rem;font-weight:600;color:var(--primary)" id="progressText">0 / 0</span>
          <span style="font-size:0.75rem;color:var(--text-muted)" id="progressPct">0%</span>
        </div>
        <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden">
          <div id="progressBar" style="height:100%;background:var(--primary);border-radius:2px;width:0%;transition:width 0.4s ease"></div>
        </div>
      </div>

      <ul class="step-list" id="stepList"></ul>

      <div id="allDoneCelebration" style="display:none;text-align:center;padding:20px 0">
        <div style="font-size:2.5rem;margin-bottom:8px;animation:bounceIn 0.5s ease">🎉</div>
        <div style="font-weight:700;font-size:1.1rem;color:var(--green)">所有步骤都完成了！</div>
        <div class="text-secondary mt-sm">你做了一件之前不想做的事 👏</div>
      </div>

      <button class="btn btn-accent btn-block mt-md" id="firstStepOnly">
        👣 只看第一步
      </button>
      <button class="btn btn-outline btn-block btn-sm mt-sm" id="newTask">
        换个任务
      </button>
    </div>

    <div id="firstStepFocus" class="card text-center fade-in-up" style="display:none;background:var(--accent-light);border:2px solid var(--accent);">
      <div class="bounce-in" style="font-size:2.5rem;margin-bottom:12px;">👣</div>
      <div style="font-weight:700;font-size:1.2rem;margin-bottom:4px;">只看第一步就够了</div>
      <p class="section-subtitle">不用想后面的事。<br>做完这一步，你就已经开始了。</p>
      <div id="firstStepText" class="big-step-wrap"></div>
      <div class="flex gap-sm" style="justify-content:center">
        <button class="btn btn-primary" id="doneFirstStep">✅ 做完第一步了</button>
        <button class="btn btn-outline" id="closeFirstStep">看全部步骤</button>
      </div>
    </div>

    <div id="firstStepDone" class="card text-center fade-in-up" style="display:none;background:var(--green-light);border:2px solid var(--green);">
      <div style="font-size:2.5rem;margin-bottom:8px;animation:bounceIn 0.5s ease">🎯</div>
      <div style="font-weight:700;font-size:1.2rem;color:var(--green);margin-bottom:4px;">你已经开始了！</div>
      <p class="section-subtitle">最难的部分已经过去了。<br>看看下一步是什么？</p>
      <button class="btn btn-primary" id="continueToAllSteps">👀 看全部步骤</button>
      <button class="btn btn-outline mt-sm" id="newTask2">换个新任务</button>
    </div>
  </div>

  <div id="historyArea" style="display:none">
    <div class="card">
      <div class="section-title">📋 历史记录</div>
      <div id="historyList"></div>
    </div>
  </div>
</div>

<button class="back-to-top-btn" id="backToTop" aria-label="返回顶部">↑</button>

<script>
/* ── 工具函数（替代原 utils.js）── */
const Storage = {
  get(key, fallback) {
    try { return JSON.parse(localStorage.getItem('adhd_' + key)) ?? fallback; } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem('adhd_' + key, JSON.stringify(value)); } catch {}
  }
};
function dateStr() {
  return new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function playNotification() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.2);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.2 + 0.5);
      osc.start(ctx.currentTime + i * 0.2);
      osc.stop(ctx.currentTime + i * 0.2 + 0.5);
    });
  } catch {}
}
/* ── 工具函数结束 ── */

/* ── 通用兜底模板 ── */
function getFallbackSteps(task) {
  return [
    { emoji: '✋', text: `深呼吸一次，告诉自己：我要开始做「${task}」了` },
    { emoji: '🔍', text: `想一想「${task}」的第一步最简单能做什么？` },
    { emoji: '🔧', text: `准备好需要的工具/材料/信息` },
    { emoji: '⏱️', text: `设定一个5分钟计时器——只做5分钟就好` },
    { emoji: '🎯', text: `动起来！开始做第1小步` },
    { emoji: '☕', text: `完成一个小阶段后，停下来喘口气` },
    { emoji: '👀', text: `检查进度，决定下一步做什么` },
    { emoji: '🏁', text: `继续推进直到完成「${task}」的核心部分` },
    { emoji: '🎉', text: `做完后给自己一个奖励` },
  ];
}

/* ── 从任务文本中提取目标对象 ── */
function extractObject(task) {
  const patterns = [
    /(?:收拾|整理|打扫|清理|收纳|擦|刷|洗|叠)\s*(.{1,6})$/,
    /(?:写|做|改|修|设计|画|拍|剪|准备|复习|学|背|练|约|办|买|去)\s*(.{1,10})$/,
  ];
  for (const p of patterns) {
    const m = task.match(p);
    if (m && m[1] && m[1].length >= 1) {
      return m[1].replace(/[的了我吧呢吗]/g, '').trim();
    }
  }
  return '';
}

/* ── 类别识别引擎 ── */
function categorizeTask(task) {
  let best = null;
  let bestScore = 0;
  for (const cat of CATEGORIES) {
    let score = 0;
    for (const kw of cat.keywords) {
      if (task.includes(kw.word)) score += kw.score;
    }
    if (task.includes(cat.name)) score += 5;
    if (score > bestScore) { bestScore = score; best = cat; }
  }
  if (best && bestScore >= 5) return { category: best, score: bestScore };
  return null;
}

/* ── 核心拆解函数 ── */
function decomposeTask(task) {
  if (!task.trim()) return [];
  const result = categorizeTask(task);
  const obj = extractObject(task);
  let steps;
  if (result) {
    steps = result.category.templates(task, obj);
  } else {
    steps = getFallbackSteps(task);
  }
  return steps.map(s => ({ text: s.text, emoji: s.emoji || '•', done: false }));
}

['taskInput','decomposeBtn','resultArea','stepList','stepCount','stepProgress',

 'historyArea','historyList','categoryTag','backToTop','newTask2','taskExamples'
].forEach(id => els[id] = document.getElementById(id));

let allChecked = false;

function updateProgress() {
  const items = els.stepList.querySelectorAll('.step-item');
  const done = els.stepList.querySelectorAll('.step-item.done').length;
  const total = items.length;
  if (total === 0) { els.stepProgress.style.display = 'none'; return; }
  els.stepProgress.style.display = 'block';
  const pct = Math.round((done / total) * 100);
  els.progressBar.style.width = pct + '%';
  els.progressText.textContent = `${done} / ${total}`;
  els.progressPct.textContent = pct + '%';
  els.stepCount.textContent = `${done} / ${total}`;

  if (done === total && total > 0 && !allChecked) {
    allChecked = true;
    els.allDoneCelebration.style.display = 'block';
    els.allDoneCelebration.scrollIntoView({ behavior: 'smooth' });
    playNotification();
    fireCelebration();
  }
}

function renderSteps(task, steps) {
  els.resultArea.style.display = 'block';
  els.firstStepFocus.style.display = 'none';
  els.firstStepDone.style.display = 'none';
  els.allDoneCelebration.style.display = 'none';
  allChecked = false;
  els.stepList.innerHTML = '';

  const result = categorizeTask(task);
  if (result) {
    els.categoryTag.style.display = 'inline-flex';
    els.categoryTag.textContent = `${result.category.icon} ${result.category.name}`;
  } else {
    els.categoryTag.style.display = 'none';
  }

  els.stepCount.textContent = `0 / ${steps.length}`;

  steps.forEach((step, i) => {
    const li = document.createElement('li');
    li.className = 'step-item slide-up';
    li.style.animationDelay = `${i * 0.06}s`;
    li.innerHTML = `
      <span class="step-number">${i + 1}</span>
      <div class="step-content">
        <span class="step-emoji">${step.emoji}</span>
        <span class="step-text">${step.text}</span>
      </div>
      <input type="checkbox" class="step-checkbox" data-index="${i}">
    `;
    li.querySelector('.step-checkbox').addEventListener('change', function() {
      li.classList.toggle('done', this.checked);
      updateProgress();
    });
    els.stepList.appendChild(li);
  });

  updateProgress();
  saveToHistory(task, steps);
  renderHistory();
  setTimeout(() => els.resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function saveToHistory(task, steps) {
  const history = Storage.get('decompose_history', []);
  const cat = categorizeTask(task);
  const tag = cat ? `${cat.category.icon} ${cat.category.name}` : '📋 通用';
  history.unshift({ task, steps: steps.length, date: dateStr(), id: uid(), tag });
  if (history.length > 20) history.length = 20;
  Storage.set('decompose_history', history);
}

function renderHistory() {
  const history = Storage.get('decompose_history', []);
  if (!history.length) { els.historyArea.style.display = 'none'; return; }
  els.historyArea.style.display = 'block';
  els.historyList.innerHTML = '';
  history.slice(0, 5).forEach(h => {
    const div = document.createElement('div');
    div.className = 'dump-entry slide-up';
    div.innerHTML = `<div class="dump-entry-meta"><span>${h.tag || '📋'}</span><span>📅 ${h.date}</span></div>
      <strong>${h.task.length > 30 ? h.task.slice(0, 30) + '…' : h.task}</strong> · ${h.steps} 步`;
    els.historyList.appendChild(div);
  });
}

function fireCelebration() {
  const overlay = document.createElement('div');
  overlay.className = 'celebration-overlay';
  const colors = ['#8db580', '#7c9a92', '#d4a574', '#a88dc8', '#f5c842', '#e88d8d'];
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (4 + Math.random() * 6) + 'px';
    piece.style.height = (4 + Math.random() * 6) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.setProperty('--duration', (2 + Math.random() * 2) + 's');
    piece.style.animationDelay = (Math.random() * 0.5) + 's';
    overlay.appendChild(piece);
  }
  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), 4000);
}
