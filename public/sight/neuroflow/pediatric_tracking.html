<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精细目力追踪互动层 - NeuroFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030303; color: #fff; overflow: hidden; margin: 0; }
        .glass-panel { background: rgba(25, 25, 25, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-nav { background: linear-gradient(to bottom, rgba(5,5,5,0.8), transparent); padding: 1.5rem; position: absolute; top: 0; width: 100%; z-index: 50; }
        canvas { touch-action: none; width: 100%; height: 100%; display: block; }
        #success-fx { pointer-events: none; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col relative bg-black">
    
    <!-- 头部导航 Glassmorphism -->
    <nav class="glass-nav flex justify-between items-center transition-opacity duration-300" id="main-nav">
        <div class="glass-panel px-6 py-2 rounded-2xl flex items-center gap-4 shadow-[0_0_20px_rgba(245,158,11,0.15)]">
            <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse" id="status-dot"></div>
            <span class="text-sm font-bold text-zinc-100 tracking-wider">贾涵专训舱</span>
            <div class="h-4 w-px bg-zinc-700"></div>
            <span class="text-xs font-mono text-zinc-400">目前得分</span>
            <span class="text-xl font-black text-amber-500 min-w-[60px]" id="score-display">0</span>
        </div>
        <div class="flex gap-3">
            <button id="btn-start" onclick="startGame()" class="glass-panel bg-amber-500/20 hover:bg-amber-500/40 text-amber-400 border border-amber-500/30 px-8 py-3 rounded-2xl font-bold transition-all hover:scale-105 active:scale-95 shadow-[0_0_15px_rgba(245,158,11,0.2)]">
                开启 10 分钟挑战
            </button>
            <button onclick="document.documentElement.requestFullscreen()" class="glass-panel p-3 rounded-2xl text-zinc-400 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            </button>
        </div>
    </nav>

    <!-- 主画布 -->
    <canvas id="game-canvas"></canvas>

    <!-- 中部反馈动画层 -->
    <div id="success-fx" class="absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-300">
        <h1 class="text-8xl md:text-9xl font-black text-amber-400 drop-shadow-[0_0_40px_rgba(245,158,11,0.8)] scale-50 transition-transform duration-500" id="success-text">
            好棒！
        </h1>
    </div>

    <!-- 游戏提示浮层 -->
    <div id="intro-layer" class="absolute inset-0 flex items-center justify-center pointer-events-none bg-black/60 backdrop-blur-sm z-40 transition-opacity">
        <div class="glass-panel p-10 rounded-3xl text-center max-w-lg border-amber-500/30 shadow-[0_0_50px_rgba(245,158,11,0.1)]">
            <div class="w-20 h-20 bg-amber-500/20 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl">🌟</div>
            <h2 class="text-2xl font-black text-white mb-3">遮掉好眼，寻找发光球</h2>
            <p class="text-zinc-400 text-sm mb-6">要求使用右眼，用手指一直按住并跟着发光球移动。如果脱落球会变灰。</p>
            <p class="text-amber-500/80 font-mono text-xs animate-pulse">Waiting for Start Command...</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const statusDot = document.getElementById('status-dot');
        const introLayer = document.getElementById('intro-layer');
        const successFx = document.getElementById('success-fx');
        const successText = document.getElementById('success-text');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if(orb.x === 0) { orb.x = width/2; orb.y = height/2; orb.targetX = width/2; orb.targetY = height/2; }
        }
        window.addEventListener('resize', resize);

        // 视标逻辑
        // 对于仅有 0.5 单眼视力的4岁孩子，Hitbox 必须极大 (视觉直径的2-3倍)
        const VISUAL_RADIUS = 35;
        const HITBOX_RADIUS = 100;

        let orb = { 
            x: 0, 
            y: 0, 
            targetX: 0, 
            targetY: 0,
            speed: 0.015, // Easing 追踪系数 - 极缓，防止小手跟不上
            isHit: false
        };

        let pointer = { active: false, x: -999, y: -999 };
        let gameState = 'idle'; // idle, playing
        let score = 0;
        let particles = [];
        let combo = 0;

        resize();

        // 随机漫游生成器
        setInterval(() => {
            if(gameState !== 'playing') return;
            // 每 2-3 秒决定下一个布朗运动的目标点，保证不出界
            orb.targetX = width * 0.15 + Math.random() * (width * 0.7);
            orb.targetY = height * 0.15 + Math.random() * (height * 0.7);
            
            // 偶然给个爆发随机奖励特效
            if(Math.random() > 0.8 && orb.isHit) triggerMilestoneFX();
        }, 2500);

        // 控制输入 (触摸与鼠标适配)
        function updatePointer(e) {
            e.preventDefault();
            // 考虑多点触控的第一个点即可
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                pointer.active = true;
            } else if (!e.touches && e.buttons > 0) {
                clientX = e.clientX;
                clientY = e.clientY;
                pointer.active = true;
            } else {
                pointer.active = false;
                return;
            }
            pointer.x = clientX;
            pointer.y = clientY;
        }

        canvas.addEventListener('pointerdown', updatePointer);
        canvas.addEventListener('pointermove', updatePointer);
        canvas.addEventListener('pointerup', () => pointer.active = false);
        canvas.addEventListener('pointercancel', () => pointer.active = false);
        // 为了确保触摸屏流畅，禁用默认滚动
        document.body.addEventListener('touchmove', e => { if(e.target === canvas) e.preventDefault(); }, { passive: false });

        function checkHit() {
            if (!pointer.active) return false;
            const dx = pointer.x - orb.x;
            const dy = pointer.y - orb.y;
            // 放水：只要距离小于极大的命中圆即算中
            return Math.sqrt(dx*dx + dy*dy) < HITBOX_RADIUS;
        }

        // 游戏引擎循环
        function animate() {
            // 背景底噪 (高频模糊颗粒) 
            ctx.fillStyle = '#080808';
            ctx.fillRect(0, 0, width, height);

            // 绘制一个缓慢移动的光栅底纹或网格来提高空间频率刺激
            ctx.strokeStyle = '#18181b';
            ctx.lineWidth = 1;
            const t = Date.now() / 1000;
            const offset = (t * 20) % 50;
            for(let i=0; i<width; i+=50) {
                ctx.beginPath(); ctx.moveTo(i + offset, 0); ctx.lineTo(i + offset, height); ctx.stroke();
            }
            for(let i=0; i<height; i+=50) {
                ctx.beginPath(); ctx.moveTo(0, i + offset); ctx.lineTo(width, i + offset); ctx.stroke();
            }

            if(gameState === 'playing') {
                // 平滑漫游插值
                orb.x += (orb.targetX - orb.x) * orb.speed;
                orb.y += (orb.targetY - orb.y) * orb.speed;
                
                // 每次增加轻微震动 (视觉挑战)
                orb.x += (Math.random() - 0.5) * 1.5;
                orb.y += (Math.random() - 0.5) * 1.5;

                orb.isHit = checkHit();

                if(orb.isHit) {
                    score += 1;
                    combo++;
                    if(score % 10 === 0) scoreDisplay.innerText = score; // 降低DOM更新频率
                    
                    statusDot.classList.replace('bg-red-500', 'bg-emerald-500');
                    if(Math.random() > 0.7) spawnParticle(orb.x, orb.y);
                } else {
                    combo = 0;
                    statusDot.classList.replace('bg-emerald-500', 'bg-red-500');
                }
            }

            // 绘制粒子
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.alpha -= 0.02;
                if(p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
                ctx.fill();
            }

            // 绘制目标视标
            ctx.save();
            ctx.translate(orb.x, orb.y);
            
            // 命中光晕
            if(orb.isHit) {
                // 呼吸效果光晕
                const pulse = 1 + Math.sin(t * 8) * 0.2;
                ctx.beginPath();
                ctx.arc(0, 0, VISUAL_RADIUS * 1.8 * pulse, 0, Math.PI*2);
                const g = ctx.createRadialGradient(0,0,0, 0,0,VISUAL_RADIUS * 1.8 * pulse);
                g.addColorStop(0, 'rgba(245, 158, 11, 0.4)');
                g.addColorStop(1, 'rgba(245, 158, 11, 0)');
                ctx.fillStyle = g;
                ctx.fill();
            }

            // 核心高对比实体 (玻璃拟物特效叠层)
            ctx.beginPath();
            ctx.arc(0, 0, VISUAL_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = orb.isHit ? '#f59e0b' : '#3f3f46';
            ctx.fill();
            
            // 高光
            ctx.beginPath();
            ctx.arc(-VISUAL_RADIUS*0.3, -VISUAL_RADIUS*0.3, VISUAL_RADIUS*0.4, 0, Math.PI*2);
            ctx.fillStyle = orb.isHit ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.1)';
            ctx.fill();

            // 辅助准星图案 (中心凹注视)
            ctx.strokeStyle = orb.isHit ? '#000' : '#71717a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-15, 0); ctx.lineTo(15, 0);
            ctx.moveTo(0, -15); ctx.lineTo(0, 15);
            ctx.stroke();

            // 若在开发模式或放宽判定模式，可以把 Hitbox 画出来 (隐形)
            // ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            // ctx.beginPath(); ctx.arc(0, 0, HITBOX_RADIUS, 0, Math.PI*2); ctx.stroke();

            ctx.restore();

            // 画手指导引线 (防丢)
            if(gameState === 'playing' && !orb.isHit && pointer.active) {
                ctx.beginPath();
                ctx.moveTo(pointer.x, pointer.y);
                ctx.lineTo(orb.x, orb.y);
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.3)'; // red-500
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.setLineDash([]);
            }

            requestAnimationFrame(animate);
        }

        // 特效与管理
        function spawnParticle(x, y) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                r: Math.random() * 4 + 2,
                color: '245, 158, 11', // amber-500
                alpha: 1
            });
        }

        function triggerMilestoneFX() {
            successFx.classList.remove('opacity-0');
            successText.classList.remove('scale-50');
            successText.classList.add('scale-100');
            setTimeout(() => {
                successFx.classList.add('opacity-0');
                successText.classList.remove('scale-100');
                successText.classList.add('scale-50');
            }, 1000);
            
            for(let i=0; i<30; i++) spawnParticle(orb.x, orb.y);
        }

        function startGame() {
            introLayer.classList.add('opacity-0');
            setTimeout(() => introLayer.style.display = 'none', 300);
            
            document.getElementById('btn-start').innerText = '训练进行中 (按ESC退出)';
            document.getElementById('btn-start').classList.add('opacity-50', 'pointer-events-none');
            
            // 开始自动隐藏导航栏，专注护眼
            setTimeout(() => {
                document.getElementById('main-nav').classList.add('opacity-0', '-translate-y-full');
            }, 5000);

            // 10 分钟倒计时逻辑略... 此处做演示
            gameState = 'playing';
            score = 0;
            scoreDisplay.innerText = 0;

            // 当手指移动时，显示导航条
            canvas.addEventListener('pointermove', () => {
                const nav = document.getElementById('main-nav');
                nav.classList.remove('opacity-0', '-translate-y-full');
                clearTimeout(nav.hideTimer);
                nav.hideTimer = setTimeout(() => nav.classList.add('opacity-0', '-translate-y-full'), 3000);
            });
        }

        // Init
        requestAnimationFrame(animate);

    </script>
</body>
</html>
